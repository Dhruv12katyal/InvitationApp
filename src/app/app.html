<!-- 1. Initial 4-Fold 3D Royal Envelope Opening Experience -->
<app-entry-envelope (completed)="onEntryComplete()"></app-entry-envelope>

<div class="wedding-app-wrapper" [class.content-revealed]="hasEntered()">
  <!-- Impressive Sticky Navbar with Royal Logo & Sitar Music -->
  <app-navbar></app-navbar>

  <main>
    <!-- 1. Auspicious Hero & Live Countdown -->
    <app-hero></app-hero>

    <!-- 2. Royal Wedding Card Unfolding & Envelope Opening Experience -->
    <app-invitation-card></app-invitation-card>

    <!-- 3. Celebrations & Itinerary (Mehendi, Haldi, Shubh Vivah) - Now directly after invitation -->
    <app-events></app-events>

    <!-- 4. The Royal Couple (Dhruv & Vaishnavi in Palace Jharokha Mandap) -->
    <app-couple></app-couple>

    <!-- 5. 1-Click WhatsApp RSVP -->
    <app-rsvp></app-rsvp>
  </main>

  <!-- 6. Auspicious Footer -->
  <app-footer></app-footer>
</div>
